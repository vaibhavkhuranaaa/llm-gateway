[project]
name = "private-llm-gateway-workbench"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "google-auth>=2.37,<3",
  "google-cloud-firestore>=2.19,<3",
  "google-cloud-secret-manager>=2.24,<3",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "pyjwt[crypto]>=2.13.0,<3",
  "pydantic>=2.9,<3",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
  "detect-secrets>=1.5,<2",
  "pip-audit>=2.9,<3",
  "pytest>=8.3,<10",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]
